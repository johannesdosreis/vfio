; Looking Glass client (B7) for the win11 VM
[app]
shmFile=/dev/kvmfr0

[win]
title=Windows 11
size=1920x1080
autoResize=yes

[input]
; laptop keyboard has no Scroll Lock (the default escape key)
escapeKey=KEY_RIGHTCTRL
rawMouse=yes

[spice]
host=127.0.0.1
port=5900

[egl]
; KWin's "Dim inactive" effect recomposites the window when it loses focus; with single
; buffering KWin reads half-drawn frames and the window flickers
doubleBuffer=yes
