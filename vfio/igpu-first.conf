# Load the Intel iGPU driver before NVIDIA so the iGPU always gets the first DRM render node
# (renderD128). Apps that simply open "the first GPU" (waywallen and its KDE wallpaper plugin)
# then stay off the dGPU, which vfio-dgpu needs free to hand to the VM.
# An install rule because kmod only honours the first softdep line per module, and nvidia.ko
# already declares its own (pre: ecdh_generic,ecdsa_generic).
install nvidia /usr/bin/modprobe i915 ; /usr/bin/modprobe --ignore-install nvidia $CMDLINE_OPTS
